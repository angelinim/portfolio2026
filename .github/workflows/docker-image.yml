name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies from lockfile
        run: npm ci

      - name: Run Tests
        run: npm run test

      - name: Run Verification
        run: npm run check

      - name: Build Docker
        run: docker build . --file Dockerfile
